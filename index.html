<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#060913">
<script src="https://puter.com"></script>
<title>DARK HORIZON AI PRO ✦</title>
<style>
:root{--bg:#060913;--surface:rgba(15,23,42,.92);--border:rgba(148,163,184,.2);--primary:#38bdf8;--accent:#818cf8;--text:#f8fafc;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 15% 10%,rgba(56,189,248,.16),transparent 40%),radial-gradient(circle at 85% 90%,rgba(129,140,248,.16),transparent 40%),var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px;background:rgba(6,9,19,.95);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e}
.new-btn{background:rgba(56,189,248,.14);color:var(--primary);border:1px solid rgba(56,189,248,.35);padding:6px 12px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:14px}
.welcome{margin:auto;text-align:center;max-width:360px;padding:24px 18px;background:var(--surface);border:1px solid var(--border);border-radius:22px}
.welcome h2{font-size:20px;margin-bottom:8px}.welcome p{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:rgba(30,41,59,.92);border:1px solid var(--border);color:#e2e8f0;padding:8px 12px;border-radius:12px;font-size:12.5px;cursor:pointer}
.msg{max-width:88%;padding:13px 16px;border-radius:18px;line-height:1.65;font-size:15px;word-wrap:break-word}
.user{align-self:flex-start;background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border-bottom-right-radius:5px}
.bot{align-self:flex-end;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:5px}
.bot img,.user img,.bot video{width:100%;max-width:340px;border-radius:14px;margin-top:10px;display:block}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.act-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;background:rgba(56,189,248,.14);color:var(--primary);border:1px solid rgba(56,189,248,.3);border-radius:10px;text-decoration:none;font-size:13px;font-weight:600;cursor:pointer}
#previewBar{display:none;margin:0 12px 8px;padding:8px 12px;background:#0f172a;border:1px solid rgba(56,189,248,.35);border-radius:12px;align-items:center;justify-content:space-between;font-size:13px;color:var(--primary)}
.dock{padding:10px 12px 14px;background:rgba(6,9,19,.95);border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;position:relative}
.icon-btn{width:44px;height:44px;border-radius:14px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
#sendBtn{background:linear-gradient(135deg,#38bdf8,#818cf8);color:#060913}
#plusBtn{background:rgba(30,41,59,.9);color:var(--primary);border:1px solid var(--border)}
.input-wrap{flex:1;background:rgba(15,23,42,.96);border:1px solid var(--border);border-radius:16px;padding:0 12px}
#q{width:100%;background:transparent;border:none;color:#fff;padding:11px 0;font-size:15px;outline:none}
#plusMenu{display:none;position:absolute;bottom:68px;left:12px;width:255px;background:#0f172a;border:1px solid var(--border);border-radius:16px;padding:7px;flex-direction:column;gap:3px;z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.pm-item{background:transparent;border:none;color:#f1f5f9;padding:10px 12px;border-radius:10px;font-size:14px;display:flex;align-items:center;gap:8px;cursor:pointer;text-align:right}
.loader{display:inline-flex;gap:5px;padding:4px 0}.loader span{width:7px;height:7px;border-radius:50%;background:var(--primary);animation:b 1.2s infinite}.loader span:nth-child(2){animation-delay:.2s}.loader span:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{transform:scale(.4);opacity:.4}40%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span> DARK HORIZON AI ✦</div>
  <button type="button" class="new-btn" id="newBtn">+ جديد</button>
</header>
<div id="chat">
  <div class="welcome" id="welcomeBox">
    <h2>DARK HORIZON AI PRO</h2>
    <p>منصة موحّدة تجمع خادم Render (`Gemini 2.0 + Groq + Cloudflare`) وكروت GPU السحابية لإنتاج صور 8K واقعية وفيديوهات سينمائية مع اللوغو الخاص بك.</p>
    <div class="chips">
      <div class="chip" data-fill="صمم صورة حصان عربي أصيل وقت الغروب">🎨 صورة واقعية 8K</div>
      <div class="chip" data-fill="اريد فيديو سباق سيارات سينمائي">🎬 فيديو سينمائي</div>
      <div class="chip" data-fill="صمم صورة شارع قديم وقت الليل بأضواء دافئة">🌃 شارع ليلي واقعي</div>
    </div>
  </div>
</div>
<div id="previewBar"><span id="prevName">📎 ملف مرفق</span><button type="button" id="clearAttBtn" style="background:none;border:none;color:#f87171;font-weight:700;cursor:pointer;font-size:15px">✕</button></div>
<input type="file" id="fileInp" style="display:none">
<div class="dock">
  <button type="button" id="sendBtn" class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
  <div class="input-wrap"><input id="q" type="text" placeholder="اكتب رسالتك أو اطلب صورة أو فيديو..."></div>
  <button type="button" id="plusBtn" class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
  <div id="plusMenu">
    <button type="button" class="pm-item" id="pickLogoBtn">🏷️ وضع اللوغو الخاص بي للصور والفيديو</button>
    <button type="button" class="pm-item" id="pickImgVisionBtn">👁️ صورة ⬅️ نص (تحليل ووصف)</button>
    <button type="button" class="pm-item" id="pickImgVidBtn">🎞️ صورة ⬅️ فيديو متحرك</button>
    <button type="button" class="pm-item" id="pickDocBtn">📄 تحليل ملف نصي / كود</button>
  </div>
</div>
<script>
// تشفير روابط الخوادم بالأرقام لمنع متصفح الهاتف من اختصارها عند النسخ
const RENDER_API = String.fromCharCode(104,116,116,112,115,58,47,47,100,97,114,107,45,104,111,114,105,122,111,110,45,97,105,46,111,110,114,101,110,100,101,114,46,99,111,109);
const HORDE_API  = String.fromCharCode(104,116,116,112,115,58,47,47,115,116,97,98,108,101,104,111,114,100,101,46,110,101,116,47,97,112,105,47,118,50);
const IMG_CDN    = String.fromCharCode(104,116,116,112,115,58,47,47,105,109,97,103,101,46,112,111,108,108,105,110,97,116,105,111,110,115,46,97,105,47,112,114,111,109,112,116,47);
const TXT_CDN    = String.fromCharCode(104,116,116,112,115,58,47,47,116,101,120,116,46,112,111,108,108,105,110,97,116,105,111,110,115,46,97,105,47);

// نبضة إيقاظ فورية لخادم Render عند فتح الصفحة
fetch(RENDER_API + "/", { mode: "no-cors" }).catch(() => {});

let history = [], attData = null, attType = null, attName = "", imgActionMode = "vision";

function toggleMenu() {
  const m = document.getElementById("plusMenu");
  m.style.display = (m.style.display === "flex") ? "none" : "flex";
}
function quickFill(t) {
  const q = document.getElementById("q");
  q.value = t; q.focus();
  document.getElementById("plusMenu").style.display = "none";
}
function clearAttach() {
  attData = null; attType = null; attName = "";
  const fi = document.getElementById("fileInp");
  if (fi) fi.value = "";
  document.getElementById("previewBar").style.display = "none";
}
function addMsg(h, c) {
  const w = document.getElementById("welcomeBox");
  if (w) w.remove();
  const ch = document.getElementById("chat");
  const d = document.createElement("div");
  d.className = "msg " + c;
  d.innerHTML = h;
  ch.appendChild(d);
  ch.scrollTop = ch.scrollHeight;
  return d;
}

// طبع اللوغو الخاص بك (أو شعار DARK HORIZON) في زاوية الصور والفيديو
async function stampLogoOnImage(imgUrl) {
  return await new Promise(res => {
    const im = new Image(); im.crossOrigin = "anonymous";
    im.onload = async () => {
      const c = document.createElement("canvas");
      c.width = 1024; c.height = 1024;
      const ctx = c.getContext("2d");
      ctx.drawImage(im, 0, 0, 1024, 1024);
      const customLogo = localStorage.getItem("dh_media_logo");
      if (customLogo) {
        await new Promise(r2 => {
          const lm = new Image();
          lm.onload = () => {
            ctx.save(); ctx.globalAlpha = 0.92;
            ctx.beginPath(); ctx.roundRect(910, 910, 88, 88, 18); ctx.clip();
            ctx.drawImage(lm, 910, 910, 88, 88); ctx.restore(); r2();
          };
          lm.onerror = () => r2(); lm.src = customLogo;
        });
      } else {
        ctx.save();
        ctx.fillStyle = "rgba(6, 9, 19, 0.76)";
        ctx.beginPath(); ctx.roundRect(796, 956, 204, 42, 10); ctx.fill();
        ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = "#38bdf8"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
        ctx.fillText("DARK HORIZON ✦", 898, 982);
        ctx.restore();
      }
      res(c.toDataURL("image/jpeg", 0.94));
    };
    im.onerror = () => res(imgUrl);
    im.src = imgUrl;
  });
}

// ترجمة ذكية للوصف عبر Gemini 2.0 / Groq في Render للحصول على واقعية فائقة
async function translateToProPrompt(arText) {
  const clean = arText.replace(/صمم لي صورة 8K واقعية لـ?|اريد فيديو|صمم فيديو|حول النص إلى فيديو سينمائي:|صمم|صورة|صور|ارسم|مشهد|فيديو/g, "").trim() || "majestic Arabian stallion in golden desert sunset";
  try {
    const r = await fetch(RENDER_API + "/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: "Translate this scene into a vivid, photorealistic 8K English photography prompt (max 25 words, English ONLY, no quotes): " + clean })
    });
    if (r.ok) {
      const d = await r.json();
      const en = (d.reply || d.response || "").trim();
      if (en && en.length > 5) return en + ", photorealistic 8k DSLR photography, cinematic lighting, sharp focus";
    }
  } catch (e) {}
  return clean + ", ultra photorealistic 8k DSLR photography, natural cinematic lighting, sharp focus, masterpiece";
}

// توليد الصور الواقعية عبر سباق متوازي (Render Cloudflare + AI Horde GPU + Direct Flux)
async function generateMasterImage(rawPrompt) {
  const enPrompt = await translateToProPrompt(rawPrompt);

  // 1. الأولوية الأولى: خادم Render الخاص بك (Cloudflare / Flux Dev)
  try {
    const r = await fetch(RENDER_API + "/api/image", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: enPrompt })
    });
    if (r.ok) {
      const ct = r.headers.get("content-type") || "";
      if (ct.includes("image")) {
        const b = await r.blob();
        if (b.size > 8000) return { url: await stampLogoOnImage(URL.createObjectURL(b)), engine: "Render-Cloudflare-8K" };
      } else {
        const d = await r.json();
        const u = d.image_url || d.url;
        if (u) return { url: await stampLogoOnImage(u), engine: "Render-Pro-8K" };
      }
    }
  } catch (e) {}

  // 2. الأولوية الثانية: كروت GPU العالمية بأقوى نماذج الواقعية الفوتوغرافية (Juggernaut XL + RealVisXL + EpicRealism)
  try {
    const r1 = await fetch(HORDE_API + "/generate/async", {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": "0000000000", "Client-Agent": "DarkHorizon:3.0:user" },
      body: JSON.stringify({
        prompt: "RAW photo, " + enPrompt + ", 8k uhd, dslr, soft lighting, high quality, film grain, Fujifilm XT3 ### (deformed, distorted, disfigured:1.3), poorly drawn, bad anatomy, wrong anatomy, extra limb, missing limb, floating limbs, (mutated hands and fingers:1.4), disconnected limbs, mutation, mutated, ugly, disgusting, blurry, amputation, cartoon, 3d, render, watermark",
        params: { sampler_name: "k_dpmpp_2m", cfg_scale: 7, width: 768, height: 768, steps: 26, karras: true, n: 1 },
        models: ["Juggernaut XL", "RealVisXL V4.0", "EpicRealism", "AlbedoBase XL (SDXL)"],
        nsfw: false
      })
    });
    if (r1.ok) {
      const j1 = await r1.json();
      if (j1 && j1.id) {
        for (let i = 0; i < 35; i++) {
          await new Promise(r => setTimeout(r, 2000));
          const st = await (await fetch(HORDE_API + "/generate/check/" + j1.id, { headers: { "Client-Agent": "DarkHorizon:3.0:user" } })).json();
          if (st && st.done) {
            const fd = await (await fetch(HORDE_API + "/generate/status/" + j1.id, { headers: { "Client-Agent": "DarkHorizon:3.0:user" } })).json();
            const gen = fd && fd.generations ? fd.generations.at(0) : null;
            if (gen && gen.img) {
              const rawImg = gen.img.startsWith("http") ? gen.img : ("data:image/webp;base64," + gen.img);
              return { url: await stampLogoOnImage(rawImg), engine: (gen.model || "Juggernaut-XL-Pro") };
            }
            break;
          }
        }
      }
    }
  } catch (e) {}

  // 3. الأولوية الثالثة: Google Imagen 4 Ultra عبر Puter (بدون علامة مائية)
  try {
    if (window.puter && puter.ai && puter.ai.txt2img) {
      const el = await puter.ai.txt2img(enPrompt, { model: "google/imagen-4.0-ultra" });
      if (el && el.src) return { url: await stampLogoOnImage(el.src), engine: "Google-Imagen-4-Ultra" };
    }
  } catch (e) {}

  return null;
}

async function askMasterAI(userPrompt) {
  const sys = "أنت DARK HORIZON AI، مساعد ذكاء اصطناعي خبير تتحدث بالعربية بطلاقة ووضوح.";
  const chatRacers = [
    (async () => {
      const r = await fetch(RENDER_API + "/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: userPrompt, messages: [{ role: "system", content: sys }, ...history.slice(-6)] })
      });
      if (!r.ok) throw new Error("rn_chat");
      const d = await r.json();
      const rep = d.reply || d.response || d.text;
      if (rep && rep.length > 1) return rep;
      throw new Error("rn_empty");
    })(),
    (async () => {
      if (!window.puter || !puter.ai || !puter.ai.chat) throw new Error("no_puter");
      const pr = await puter.ai.chat(sys + "\n\n" + userPrompt);
      const t = (typeof pr === "string") ? pr : (pr?.message?.content || String(pr));
      if (t && t.length > 1 && !t.includes("Free limit")) return t;
      throw new Error("p_empty");
    })(),
    (async () => {
      const r = await fetch(TXT_CDN + encodeURIComponent(userPrompt) + "?system=" + encodeURIComponent(sys) + "&seed=" + Math.floor(Math.random() * 9999));
      const t = await r.text();
      if (t && t.length > 2 && !t.includes("Free limit reached")) return t.trim();
      throw new Error("txt_limit");
    })()
  ];
  try { return await Promise.any(chatRacers); } catch (e) { return "⚠️ يرجى إعادة المحاولة بعد لحظات."; }
}

function speakArabic(text) {
  const clean = text.replace(/[*#|_~`(){}<>\/\\•\-:؛،."'!؟]/g, " ").trim();
  if (!clean) return;
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = "ar-SA";
    window.speechSynthesis.speak(u);
  }
}

async function generateMasterVideo(promptTxt, uploadedImgUrl, targetBubble) {
  targetBubble.innerHTML = "🎬 جاري إنتاج المشاهد السينمائية والحوار الصوتي...";
  const enPrompt = await translateToProPrompt(promptTxt);
  try {
    const rv = await fetch(RENDER_API + "/api/video", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: enPrompt, image: uploadedImgUrl || null })
    });
    if (rv.ok && (rv.headers.get("content-type") || "").includes("video")) {
      const vb = await rv.blob();
      if (vb.size > 15000) {
        const vUrl = URL.createObjectURL(vb);
        targetBubble.innerHTML = `<div>🎬 تم إنتاج الفيديو الحقيقي عبر خادم Render:</div><video src="${vUrl}" controls autoplay loop playsinline></video><div class="actions"><a class="act-btn" href="${vUrl}" download="DarkHorizon_Render_Video.mp4">⬇️ تحميل الفيديو</a></div>`;
        return;
      }
    }
  } catch (e) {}

  const dialogue = await askMasterAI("اكتب حواراً سينمائياً قصيراً ومشوقاً من سطرين فقط باللغة العربية يناسب هذا المشهد: " + promptTxt);
  let frames = uploadedImgUrl ? [uploadedImgUrl] : [];
  if (!frames.length) {
    const s1 = await generateMasterImage(promptTxt + ", wide cinematic establishing shot");
    const s2 = await generateMasterImage(promptTxt + ", dramatic action close up");
    if (s1 && s1.url) frames.push(s1.url);
    if (s2 && s2.url) frames.push(s2.url);
  }
  if (!frames.length) { targetBubble.innerHTML = "⚠️ تعذر توليد لقطات الفيديو حالياً، أعد المحاولة."; return; }

  const canvas = document.createElement("canvas");
  canvas.width = 720; canvas.height = 720;
  const ctx = canvas.getContext("2d");
  const validImgs = (await Promise.all(frames.map(src => new Promise(res => {
    const im = new Image(); im.crossOrigin = "anonymous";
    im.onload = () => res(im); im.onerror = () => res(null); im.src = src;
  })))).filter(Boolean);

  const stream = canvas.captureStream(24);
  const recorder = new MediaRecorder(stream, { mimeType: "video/webm" });
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  recorder.onstop = () => {
    const vUrl = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
    targetBubble.innerHTML = `<div>🎬 <b>تم إنتاج المشاهد السينمائية المتسلسلة:</b></div><div style="margin:8px 0;padding:8px 10px;background:rgba(56,189,248,.08);border-right:3px solid #38bdf8;border-radius:8px;font-size:13.5px">🎙️ <b>الحوار الصوتي:</b><br>${dialogue.replace(/\n/g, "<br>")}</div><video src="${vUrl}" controls autoplay loop playsinline></video><div class="actions"><a class="act-btn" href="${vUrl}" download="DarkHorizon_Cinema.webm">⬇️ تحميل الفيديو</a><button type="button" class="act-btn" onclick="speakArabic(this.closest('.msg').innerText)">🔊 استماع للحوار</button></div>`;
    speakArabic(dialogue);
  };

  recorder.start();
  let f = 0; const total = 120, per = total / validImgs.length;
  const timer = setInterval(() => {
    const idx = Math.min(Math.floor(f / per), validImgs.length - 1);
    const scale = 1.0 + ((f % per) / per) * 0.14;
    const w = 720 * scale, h = 720 * scale;
    ctx.clearRect(0, 0, 720, 720);
    ctx.drawImage(validImgs.at(idx), (720 - w) / 2, (720 - h) * 0.22, w, h);
    if (++f >= total) { clearInterval(timer); recorder.stop(); }
  }, 1000 / 24);
}
async function send() {
  const inp = document.getElementById("q"), val = inp.value.trim();
  if (!val && !attData) return;
  const cd = attData, ct = attType, cn = attName, curMode = imgActionMode;
  clearAttach(); inp.value = "";
  let uh = val ? "<div>" + val.replace(/</g, "&lt;") + "</div>" : "";
  if (ct === "img" && cd) uh += "<img src='" + cd + "'>";
  if (ct === "doc") uh += "<div style='font-size:12px;margin-top:4px'>📄 " + cn + "</div>";
  addMsg(uh, "user");
  const wait = addMsg("<div class='loader'><span></span><span></span><span></span></div>", "bot");

  if (ct === "img" && cd) {
    if (curMode === "video" || /(فيديو|حرك|video)/i.test(val)) await generateMasterVideo(val || "مشهد سينمائي متحرك", cd, wait);
    else {
      const rep = await askMasterAI("صف هذه الصورة بالتفصيل بالعربية: " + (val || ""));
      wait.innerHTML = `<div class="txt-body">${rep.replace(/\n/g, "<br>")}</div>`;
    }
    return;
  }
  if (/(فيديو|مشهد|حرك|أنيميشن|video)/i.test(val)) { await generateMasterVideo(val, null, wait); return; }
  if (/(صمم|صورة|صور|ارسم|أنمي|انمي|image|draw)/i.test(val) && ct !== "doc") {
    const imgObj = await generateMasterImage(val);
    if (imgObj && imgObj.url) wait.innerHTML = `<div>🎨 تم تصميم الصورة بدقة عالية (<b>${imgObj.engine}</b>):</div><img src="${imgObj.url}"><div class="actions"><a class="act-btn" href="${imgObj.url}" download="DarkHorizon_8K.jpg">⬇️ تحميل الصورة</a><button type="button" class="act-btn" onclick="generateMasterVideo('${val.replace(/'/g, "").slice(0, 60)}', '${imgObj.url}', this.closest('.msg'))">🎬 تحويل لفيديو</button></div>`;
    else wait.innerHTML = "⚠️ الخوادم مزدحمة لحظياً، اضغط إرسال مرة أخرى.";
    return;
  }
  let fp = (ct === "doc" && cd) ? `محتوى الملف (${cn}):\n${String(cd).slice(0, 4000)}\n\nالمطلوب: ${val || "لخّص هذا الملف"}` : val;
  history.push({ role: "user", content: fp });
  const rep = await askMasterAI(fp);
  history.push({ role: "assistant", content: rep });
  wait.innerHTML = `<div class="txt-body">${rep.replace(/</g, "&lt;").replace(/\n/g, "<br>")}</div><div class="actions"><button type="button" class="act-btn copy-btn">📋 نسخ</button><button type="button" class="act-btn tts-btn">🔊 استماع</button></div>`;
  wait.querySelector(".copy-btn").onclick = function() { navigator.clipboard.writeText(rep); this.textContent = "✅ تم النسخ"; };
  wait.querySelector(".tts-btn").onclick = function() { speakArabic(rep); };
}

window.addEventListener("DOMContentLoaded", function() {
  document.getElementById("sendBtn").onclick = send;
  document.getElementById("plusBtn").onclick = function(e) { e.stopPropagation(); toggleMenu(); };
  document.getElementById("newBtn").onclick = function() { history = []; clearAttach(); document.getElementById("chat").innerHTML = ""; };
  document.getElementById("clearAttBtn").onclick = clearAttach;
  document.getElementById("q").onkeydown = function(e) { if (e.key === "Enter") { e.preventDefault(); send(); } };
  document.getElementById("pickLogoBtn").onclick = function() { attType = "logo"; document.getElementById("plusMenu").style.display = "none"; const f = document.getElementById("fileInp"); f.accept = "image/*"; f.click(); };
  document.getElementById("pickImgVisionBtn").onclick = function() { attType = "img"; imgActionMode = "vision"; document.getElementById("plusMenu").style.display = "none"; const f = document.getElementById("fileInp"); f.accept = "image/*"; f.click(); };
  document.getElementById("pickImgVidBtn").onclick = function() { attType = "img"; imgActionMode = "video"; document.getElementById("plusMenu").style.display = "none"; const f = document.getElementById("fileInp"); f.accept = "image/*"; f.click(); };
  document.getElementById("pickDocBtn").onclick = function() { attType = "doc"; document.getElementById("plusMenu").style.display = "none"; const f = document.getElementById("fileInp"); f.accept = ".txt,.py,.js,.json,.csv,.md,.html"; f.click(); };
  document.getElementById("fileInp").onchange = function() {
    const f = this.files ? this.files.at(0) : null; if (!f) return; attName = f.name;
    const r = new FileReader();
    r.onload = function(e) {
      if (attType === "logo") {
        localStorage.setItem("dh_media_logo", e.target.result);
        addMsg("✅ تم حفظ اللوغو الخاص بك! سيُطبع تلقائياً داخل زاوية كل صورة وفيديو تُنشئه.", "bot");
        attType = null; return;
      }
      attData = e.target.result;
      document.getElementById("prevName").textContent = (attType === "img" ? "🖼️ " : "📄 ") + attName;
      document.getElementById("previewBar").style.display = "flex";
    };
    if (attType === "doc") r.readAsText(f); else r.readAsDataURL(f);
  };
  document.querySelectorAll("[data-fill]").forEach(el => { el.onclick = function() { quickFill(this.getAttribute("data-fill")); }; });
  document.addEventListener("click", e => { if (!e.target.closest("#plusBtn") && !e.target.closest("#plusMenu")) document.getElementById("plusMenu").style.display = "none"; });
});
</script>
</body>
</html>
