<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#07080c"><link rel="manifest" href="./manifest.json"><title>DARK HORIZON AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:radial-gradient(circle at 50% 0%,#171c2b 0%,#07080c 100%);color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{padding:14px 18px;background:rgba(12,14,20,0.85);backdrop-filter:blur(16px);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.08);z-index:50}
.brand{font-weight:900;font-size:17px;background:linear-gradient(135deg,#38bdf8,#818cf8,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn-modern{background:rgba(255,255,255,0.08);color:#f1f5f9;border:1px solid rgba(255,255,255,0.14);border-radius:99px;padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer}
.btn-modern:active{transform:scale(0.92);background:rgba(56,189,248,0.25)}
#chat{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px;user-select:text}
.msg{max-width:88%;padding:14px 17px;border-radius:22px;line-height:1.65;font-size:15px;word-wrap:break-word;box-shadow:0 8px 24px rgba(0,0,0,0.28)}
.USER{align-self:flex-start;background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid rgba(56,189,248,0.22);border-bottom-right-radius:6px}
.AI{align-self:flex-end;background:rgba(18,21,30,0.94);border:1px solid rgba(255,255,255,0.09);border-bottom-left-radius:6px;width:92%}
.dock{position:relative;padding:10px 14px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,#07080c 85%,transparent);z-index:60}
.plus-menu{display:none;position:absolute;bottom:84px;right:16px;background:rgba(19,23,34,0.98);backdrop-filter:blur(20px);border:1px solid rgba(56,189,248,0.3);border-radius:22px;padding:8px;width:265px;box-shadow:0 20px 50px rgba(0,0,0,0.8);z-index:999;flex-direction:column;gap:5px}
.plus-menu.show{display:flex}
.pm-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:15px;background:rgba(255,255,255,0.03);border:none;color:#f8fafc;font-size:14px;font-weight:600;cursor:pointer;text-align:right;width:100%}
.pm-item:active{background:rgba(56,189,248,0.2)}
#preview-bar{display:none;align-items:center;gap:10px;background:#161b28;padding:9px 14px;border-radius:16px;margin-bottom:8px;border:1px solid rgba(56,189,248,0.3);font-size:13px}
.bar{display:flex;align-items:center;gap:8px;background:rgba(20,24,36,0.95);border:1px solid rgba(255,255,255,0.16);border-radius:99px;padding:6px 8px}
.plus{width:44px;height:44px;border-radius:50%;border:1px solid rgba(56,189,248,0.3);background:rgba(56,189,248,0.18);color:#38bdf8;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0}
input[type=text]{flex:1;background:transparent;border:none;color:#fff;font-size:15px;padding:8px 6px;outline:none;min-width:0;user-select:text}
.send{width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(135deg,#38bdf8,#818cf8);color:#07080c;font-size:19px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
img,video{max-width:100%;border-radius:16px;margin-top:12px;display:block}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.act{background:rgba(56,189,248,0.14);color:#38bdf8;border:1px solid rgba(56,189,248,0.3);padding:8px 15px;border-radius:99px;text-decoration:none;font-size:12px;font-weight:700;cursor:pointer}
</style></head>
<body>
<header><div class="brand">✦ DARK HORIZON</div><button id="btnNew" type="button" class="btn-modern">+ محادثة جديدة</button></header>
<div id="chat"></div>
<div class="dock">
  <div id="plusMenu" class="plus-menu">
    <button type="button" class="pm-item" data-act="img">🖼️ إرفاق صورة للتحليل أو التحريك</button>
    <button type="button" class="pm-item" data-act="doc">📄 إرفاق ملف نصي</button>
    <button type="button" class="pm-item" data-act="gen-img">🎨 تصميم صورة 8K</button>
    <button type="button" class="pm-item" data-act="gen-vid">🎬 إنتاج حلقة أنمي / فيديو ناطق</button>
  </div>
  <div id="preview-bar"><span id="prev-name">📎 مرفق</span><button id="btnClear" type="button" style="margin-right:auto;background:none;border:none;color:#f87171;font-weight:bold;cursor:pointer">✖ إلغاء</button></div>
  <input type="file" id="fileInp" style="display:none">
  <div class="bar"><button id="btnPlus" type="button" class="plus">+</button><input type="text" id="q" placeholder="اكتب طلبك (محادثة، صورة، فيديو، أنمي)..."><button id="btnSend" type="button" class="send">➤</button></div>
</div>
<script id="ui-core">
window.DH_UI = { attData: null, attType: null, attName: "" };
(function(){
  var chat = document.getElementById("chat"), q = document.getElementById("q"), menu = document.getElementById("plusMenu"), fileInp = document.getElementById("fileInp"), prevBar = document.getElementById("preview-bar"), prevName = document.getElementById("prev-name");
  window.DH_UI.clearAttachment = function(){ window.DH_UI.attData = null; window.DH_UI.attType = null; window.DH_UI.attName = ""; prevBar.style.display = "none"; fileInp.value = ""; };
  window.DH_UI.addMsg = function(role, text, media){
    var d = document.createElement("div"); d.className = "msg " + role; d.innerHTML = String(text).replace(/\n/g, "<br>");
    if(media && media.user_img){ var uim = document.createElement("img"); uim.src = media.user_img; uim.style.maxHeight = "220px"; d.appendChild(uim); }
    if(media && media.img){ var im = document.createElement("img"); im.src = media.img; d.appendChild(im); var ac = document.createElement("div"); ac.className = "actions"; var dl = document.createElement("a"); dl.className = "act"; dl.href = media.img; dl.download = "DarkHorizon_8K.jpg"; dl.target = "_blank"; dl.textContent = "⬇️ تحميل الصورة"; ac.appendChild(dl); d.appendChild(ac); }
    if(media && media.vid){ var vd = document.createElement("video"); vd.src = media.vid; vd.controls = true; vd.autoplay = true; vd.loop = true; vd.playsInline = true; d.appendChild(vd); var acv = document.createElement("div"); acv.className = "actions"; var dlv = document.createElement("a"); dlv.className = "act"; dlv.href = media.vid; dlv.download = "DarkHorizon_Anime.mp4"; dlv.target = "_blank"; dlv.textContent = "⬇️ تحميل الفيديو"; acv.appendChild(dlv); d.appendChild(acv); }
    if(role === "AI" && (!media || (!media.img && !media.vid))){ var ac2 = document.createElement("div"); ac2.className = "actions"; var cp = document.createElement("button"); cp.type = "button"; cp.className = "act"; cp.textContent = "📋 نسخ"; cp.addEventListener("click", function(){ navigator.clipboard.writeText(text); cp.textContent = "✅ تم النسخ"; setTimeout(function(){ cp.textContent = "📋 نسخ"; }, 1500); }); ac2.appendChild(cp); d.appendChild(ac2); }
    chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
  };
  document.getElementById("btnNew").addEventListener("click", function(){ try{ localStorage.removeItem("dh_hist"); }catch(e){} chat.innerHTML = ""; if(window.DH_ENGINE && window.DH_ENGINE.reset) window.DH_ENGINE.reset(); });
  document.getElementById("btnPlus").addEventListener("click", function(e){ e.stopPropagation(); menu.classList.toggle("show"); });
  document.addEventListener("click", function(e){ if(!menu.contains(e.target) && e.target.id !== "btnPlus") menu.classList.remove("show"); });
  document.getElementById("btnClear").addEventListener("click", window.DH_UI.clearAttachment);
  menu.querySelectorAll(".pm-item").forEach(function(btn){ btn.addEventListener("click", function(){ var act = btn.getAttribute("data-act"); menu.classList.remove("show"); if(act === "img"){ fileInp.accept = "image/*"; window.DH_UI.attType = "img"; fileInp.click(); } else if(act === "doc"){ fileInp.accept = ".txt,.py,.json,.csv,.md,.html,.js"; window.DH_UI.attType = "doc"; fileInp.click(); } else if(act === "gen-img"){ q.value = "صمم لي صورة سينمائية بدقة 8K لـ "; q.focus(); } else if(act === "gen-vid"){ q.value = "اصنع حلقة أنمي حوارية عن "; q.focus(); } }); });
  fileInp.addEventListener("change", function(){ var f = fileInp.files && fileInp.files.item(0); if(!f) return; window.DH_UI.attName = f.name; var r = new FileReader(); r.onload = function(ev){ window.DH_UI.attData = ev.target.result; prevName.textContent = "📎 " + window.DH_UI.attName; prevBar.style.display = "flex"; }; if(window.DH_UI.attType === "doc") r.readAsText(f); else r.readAsDataURL(f); });
  function triggerSend(){ var txt = q.value.trim(); if(!txt && !window.DH_UI.attData) return; if(window.DH_ENGINE && window.DH_ENGINE.send){ window.DH_ENGINE.send(txt); } else { window.DH_UI.addMsg("AI", "⏳ جاري تحميل المحرك..."); } }
  document.getElementById("btnSend").addEventListener("click", triggerSend);
  q.addEventListener("keydown", function(e){ if(e.key === "Enter") triggerSend(); });
})();
</script>
<script src="./engine.js?v=2"></script>
</body></html>
