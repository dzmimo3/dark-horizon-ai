          var rec = new MediaRecorder(vStream, {mimeType: mimeOut}), chunks = [];
          rec.ondataavailable = function(e){ if(e.data.size > 0) chunks.push(e.data); };
          var doneRec = new Promise(function(res){ rec.onstop = function(){ oscs.forEach(function(o){ try{o.stop();}catch(ex){} }); try{actx.close();}catch(ex){} res(URL.createObjectURL(new Blob(chunks, {type: mimeOut}))); }; });
          rec.start();

          var uTime = gl.getUniformLocation(prog, 'u_time');
          var uProg = gl.getUniformLocation(prog, 'u_prog');
          var uMode = gl.getUniformLocation(prog, 'u_mode'); var uFlt = gl.getUniformLocation(prog, 'u_flt'); var fltVal = document.getElementById('filterSel') ? parseInt(document.getElementById('filterSel').value, 10) : 0;
          var pts = Array.from({length: 30}, function(){ return {x: Math.random()*hud.width, y: Math.random()*hud.height, r: 1.5+Math.random()*2.5, vx: (Math.random()-0.5)*1.2, vy: -0.6-Math.random()*1.2, a: 0.35+Math.random()*0.55}; });

          var totalFrames = targetSec * 30, perScene = Math.max(Math.floor(totalFrames / texList.length), 30), fc = 0;
          await new Promise(function(res){
            var tm = setInterval(function(){
              var idx = Math.min(Math.floor(fc / perScene), texList.length - 1);
              var lp = (fc % perScene) / perScene;
              gl.viewport(0, 0, cv.width, cv.height);
              gl.bindTexture(gl.TEXTURE_2D, texList[idx]);
              gl.uniform1f(uTime, fc * 0.033);
              gl.uniform1f(uProg, lp);
              gl.uniform1i(uMode, idx % 2); gl.uniform1i(uFlt, fltVal);
              gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

              hctx.clearRect(0, 0, hud.width, hud.height);
              hctx.drawImage(cv, 0, 0);

              pts.forEach(function(pt){
                pt.x += pt.vx; pt.y += pt.vy;
                if(pt.y < 0) pt.y = hud.height;
                if(pt.x < 0) pt.x = hud.width;
                if(pt.x > hud.width) pt.x = 0;
                hctx.beginPath(); hctx.arc(pt.x, pt.y, pt.r, 0, Math.PI*2);
                hctx.fillStyle = 'rgba(255, 225, 160, ' + pt.a + ')'; hctx.fill();
              });

              var cap = captions[idx % captions.length];
              if(cap){
                var grad = hctx.createLinearGradient(0, hud.height*0.72, 0, hud.height);
                grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, 'rgba(0,0,0,0.85)');
                hctx.fillStyle = grad; hctx.fillRect(0, hud.height*0.72, hud.width, hud.height*0.28);
                hctx.font = 'bold ' + Math.round(hud.width * 0.044) + 'px sans-serif';
                hctx.textAlign = 'center'; hctx.fillStyle = '#ffffff';
                hctx.shadowColor = 'rgba(0,0,0,0.9)'; hctx.shadowBlur = 8;
                hctx.fillText(cap, hud.width/2, hud.height * 0.91);
                hctx.shadowBlur = 0;
              }
              if(++fc >= totalFrames){ clearInterval(tm); rec.stop(); res(); }
            }, 33);
          });
          var fbVid = await doneRec;
          wait.remove();
          addMsg('AI', '🎬 <b>تم إنتاج الفيديو بالموشن جرافيك والذكاء الاصطناعي (' + targetSec + ' ثوانٍ):</b>', {vid: fbVid});
          if(captions.length > 0 && 'speechSynthesis' in window){
            var ut = new SpeechSynthesisUtterance(captions.join(' ، '));
            ut.lang = 'ar-SA'; window.speechSynthesis.speak(ut);
          }
        }
      } else if((low.indexOf('صورة') !== -1 || low.indexOf('صور') !== -1 || low.indexOf('ارسم') !== -1 || low.indexOf('صمم') !== -1 || low.indexOf('image') !== -1) && cType !== 'img'){
        var cleanT = t.replace(/صمم لي صور|صمم لي صورة|صمم صورة|ارسم لي|ارسم|صور|صورة/gi, '').trim();
        var en = cleanT.length > 2 ? await askAI([{role:'user', content:'Write a short, realistic, modest 8K English photo description (max 15 words, ONLY English, always modest): ' + cleanT}]) : 'majestic Arabian horse in golden Sahara desert at sunset, ultra realistic 8k photography';
        en = en.replace(/[^a-zA-Z0-9 ,.-]/g, '').trim().slice(0, 140) || 'cinematic ultra realistic 8k landscape photography';
        var isAnimeImg = (document.getElementById('animeModeChk') && document.getElementById('animeModeChk').checked) || low.indexOf('انمي') !== -1 || low.indexOf('أنمي') !== -1 || low.indexOf('كرتون') !== -1 || low.indexOf('anime') !== -1;
        if(isAnimeImg){
          en = (lockedHero ? lockedHero + ', ' : '') + en + ', masterpiece Japanese anime key visual, Studio Ghibli and Ufotable style, vibrant cel shading, 8k';
        }
        var wImgUrl = 'https:' + sl + sl + 'hidden-bread-95eb.dz30007000.workers.dev' + sl + 'image';
        var ir = await fetch(wImgUrl, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({prompt: en, width: dims.w, height: dims.h})
        });
        var iData = await ir.json().catch(function(){ return {}; });
        if(!ir.ok || !iData.image_url) throw new Error(iData.error || 'فشل توليد الصورة');
        wait.remove(); addMsg('AI', '🎨 <b>تم تصميم الصورة بدقة عالية (' + (iData.engine || 'AI') + '):</b>', {img: iData.image_url});
      } else {
        var fullT = cType === 'doc' ? (t + '\n\n[محتوى الملف ' + cName + ']:\n' + String(cData).slice(0, 4000)) : (t || 'مرحباً');
        hist.push({role:'user', content: fullT});
        var rep = await askAI(hist, cType === 'img' ? cData : null);
        hist.push({role:'assistant', content: rep});
        saveHist(); wait.remove(); addMsg('AI', rep);
      }
    } catch(err){ wait.innerHTML = '⚠️ ' + (err.message || err); }
  }
  
  var tplEl = document.getElementById('tplSel');
  if(tplEl){
    tplEl.addEventListener('change', function(){
      var v = tplEl.value; tplEl.value = '';
      if(v === 'cat'){ q.value = 'صمم لي فيديو طريف لقط برتقالي سمين يمشي على قدمين ويحمل سلة سمك في سوق شعبي'; doSend(); }
      else if(v === 'story'){ q.value = 'صمم لي فيديو قصة سينمائية ملهمة عن رحلة عبر الصحراء الذهبية وقت الغروب'; doSend(); }
      else if(v === 'ad'){ q.value = 'صمم لي فيديو إعلان تجاري فاخر لعطر عربي أصيل مع إضاءة ذهبية'; doSend(); }
      else if(v === 'sport'){ q.value = 'صمم لي فيديو رياضي حماسي لعداء يركض في ملعب عالمي وقت الغروب'; doSend(); }
    });
  }
  var durEl = document.getElementById('vidDur');
  if(durEl){
    durEl.addEventListener('change', function(){
      if(durEl.value === 'custom'){
        var cSec = prompt('أدخل مدة الفيديو بالثواني (مثلاً: 45 أو 90 أو 180):', '60');
        if(cSec && !isNaN(parseInt(cSec, 10))){
          var opt = document.createElement('option');
          opt.value = parseInt(cSec, 10); opt.textContent = '⏱️ ' + opt.value + 'ث'; opt.selected = true;
          durEl.insertBefore(opt, durEl.lastElementChild);
        } else { durEl.value = '10'; }
      }
    });
  }

  
  var lockedHero = localStorage.getItem('dh_anime_hero') || '';
  var btnHero = document.getElementById('btnCharLock');
  if(btnHero){
    if(lockedHero) btnHero.textContent = '👤 البطل: مفعّل';
    btnHero.addEventListener('click', function(){
      var h = prompt('اكتب وصف بطل الأنمي لتثبيته في كل المشاهد (اتركه فارغاً للإلغاء):', lockedHero || 'young warrior with spiky black hair, blue eyes, wearing white and blue long coat');
      if(h !== null){
        lockedHero = h.trim();
        localStorage.setItem('dh_anime_hero', lockedHero);
        btnHero.textContent = lockedHero ? '👤 البطل: مفعّل' : '👤 بطل الأنمي';
      }
    });
  }

  document.getElementById('btnSend').addEventListener('click', doSend);
  q.addEventListener('keydown', function(e){ if(e.key === 'Enter') doSend(); });
})();
</script></body></html>
