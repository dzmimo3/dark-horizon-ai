<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>DARK HORIZON AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at top,#181b22 0%,#0b0c0e 100%);color:#f1f3f4;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;height:100vh}
header{padding:14px 18px;background:rgba(20,22,27,0.92);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.08)}
.brand{font-weight:800;font-size:16px;background:linear-gradient(90deg,#a8c7fa,#d2e3fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top-btn{background:rgba(255,255,255,0.08);color:#e3e3e3;border:1px solid rgba(255,255,255,0.14);border-radius:20px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:86%;padding:13px 17px;border-radius:20px;line-height:1.65;font-size:15px;word-wrap:break-word;box-shadow:0 4px 16px rgba(0,0,0,0.25)}
.USER{align-self:flex-start;background:linear-gradient(135deg,#262932,#1e2028);border:1px solid rgba(255,255,255,0.08);border-bottom-right-radius:6px}
.AI{align-self:flex-end;background:rgba(24,26,32,0.94);border:1px solid rgba(168,199,250,0.16);border-bottom-left-radius:6px;width:92%}
.dock{position:relative;padding:10px 14px 16px;background:linear-gradient(to top,#0b0c0e 75%,transparent)}
.plus-menu{display:none;position:absolute;bottom:78px;right:16px;background:#1c1f26;border:1px solid rgba(168,199,250,0.25);border-radius:18px;padding:8px;width:250px;box-shadow:0 12px 32px rgba(0,0,0,0.65);z-index:99;flex-direction:column;gap:4px}
.plus-menu.show{display:flex}
.pm-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:transparent;border:none;color:#f1f3f4;font-size:14px;cursor:pointer;text-align:right;width:100%}
.pm-item:active{background:rgba(168,199,250,0.2)}
#preview-bar{display:none;align-items:center;gap:10px;background:#1c1f26;padding:8px 14px;border-radius:16px;margin-bottom:8px;border:1px solid rgba(168,199,250,0.25);font-size:13px}
.bar{display:flex;align-items:center;gap:8px;background:#181a20;border:1px solid rgba(255,255,255,0.16);border-radius:30px;padding:6px 10px 6px 6px}
.plus{width:40px;height:40px;border-radius:50%;border:none;background:rgba(168,199,250,0.16);color:#a8c7fa;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:bold}
input[type=text]{flex:1;background:transparent;border:none;color:#fff;font-size:15px;padding:8px 6px;outline:none}
.send{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#a8c7fa,#669df6);color:#041e49;font-size:18px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center}
img,video{max-width:100%;border-radius:14px;margin-top:12px;display:block}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.act{background:rgba(168,199,250,0.14);color:#a8c7fa;border:1px solid rgba(168,199,250,0.28);padding:7px 14px;border-radius:14px;text-decoration:none;font-size:12px;font-weight:600;cursor:pointer}
</style></head>
<body>
<header><div class="brand">✦ DARK HORIZON AI v21</div><button id="btnNew" type="button" class="top-btn">+ محادثة جديدة</button></header>
<div id="chat"></div>
<div class="dock">
  <div id="plusMenu" class="plus-menu">
    <button type="button" class="pm-item" data-act="img">🖼️ إضافة صورة</button>
    <button type="button" class="pm-item" data-act="doc">📄 إضافة ملف نصي</button>
    <button type="button" class="pm-item" data-act="gen-img">🎨 تصميم صورة 8K فورية</button>
    <button type="button" class="pm-item" data-act="gen-vid">🎥 توليد مشهد سينمائي</button>
  </div>
  <div id="preview-bar"><span id="prev-name">📎 مرفق</span><button id="btnClear" type="button" style="margin-right:auto;background:none;border:none;color:#f28b82;font-weight:bold">✖ إلغاء</button></div>
  <input type="file" id="fileInp" style="display:none">
  <div class="bar"><button id="btnPlus" type="button" class="plus">+</button><input type="text" id="q" placeholder="اكتب رسالتك أو اطلب صورة..."><button id="btnSend" type="button" class="send">➤</button></div>
</div>
<script>
(function(){
  var hist = [], attData = null, attType = null, attName = '';
  var chat = document.getElementById('chat');
  var q = document.getElementById('q');
  var menu = document.getElementById('plusMenu');
  var fileInp = document.getElementById('fileInp');
  var prevBar = document.getElementById('preview-bar');
  var prevName = document.getElementById('prev-name');

  document.getElementById('btnNew').addEventListener('click', function(){ hist = []; chat.innerHTML = ''; });
  document.getElementById('btnPlus').addEventListener('click', function(e){ e.stopPropagation(); menu.classList.toggle('show'); });
  document.addEventListener('click', function(e){ if(!menu.contains(e.target) && e.target.id !== 'btnPlus') menu.classList.remove('show'); });
  document.getElementById('btnClear').addEventListener('click', function(){ attData = null; attType = null; attName = ''; prevBar.style.display = 'none'; });

  menu.querySelectorAll('.pm-item').forEach(function(btn){
    btn.addEventListener('click', function(){
      var act = btn.getAttribute('data-act'); menu.classList.remove('show');
      if(act === 'img'){ fileInp.accept = 'image/*'; attType = 'img'; fileInp.click(); }
      else if(act === 'doc'){ fileInp.accept = '.txt,.py,.json,.csv,.md,.html'; attType = 'doc'; fileInp.click(); }
      else if(act === 'gen-img'){ q.value = 'صمم لي صورة سينمائية فائقة الواقعية بدقة 8K لـ '; q.focus(); }
      else if(act === 'gen-vid'){ q.value = 'صمم لي مشهد سينمائي متحرك لـ '; q.focus(); }
    });
  });

  fileInp.addEventListener('change', function(){
    var f = fileInp.files.item(0); if(!f) return; attName = f.name;
    var r = new FileReader();
    r.onload = function(ev){ attData = ev.target.result; prevName.textContent = '📎 ' + attName; prevBar.style.display = 'flex'; };
    if(attType === 'doc') r.readAsText(f); else r.readAsDataURL(f);
  });
  function addMsg(role, text, media){
    var d = document.createElement('div'); d.className = 'msg ' + role;
    d.innerHTML = String(text).replace(/\n/g, '<br>');
    if(media && media.user_img){ var uim = document.createElement('img'); uim.src = media.user_img; uim.style.maxHeight = '220px'; d.appendChild(uim); }
    if(media && media.img){
      var im = document.createElement('img'); im.src = media.img; d.appendChild(im);
      var ac = document.createElement('div'); ac.className = 'actions';
      var dl = document.createElement('a'); dl.className = 'act'; dl.href = media.img; dl.download = 'DarkHorizon_8K.jpg'; dl.target = '_blank'; dl.textContent = '⬇️ تحميل الصورة';
      ac.appendChild(dl); d.appendChild(ac);
    }
    if(media && media.vid){
      var vd = document.createElement('video'); vd.src = media.vid; vd.controls = true; vd.autoplay = true; vd.loop = true; vd.playsInline = true; d.appendChild(vd);
      var acv = document.createElement('div'); acv.className = 'actions';
      var dlv = document.createElement('a'); dlv.className = 'act'; dlv.href = media.vid; dlv.download = 'DarkHorizon_Video.webm'; dlv.target = '_blank'; dlv.textContent = '⬇️ تحميل الفيديو';
      acv.appendChild(dlv); d.appendChild(acv);
    }
    if(role === 'AI' && (!media || (!media.img && !media.vid))){
      var ac2 = document.createElement('div'); ac2.className = 'actions';
      var cp = document.createElement('button'); cp.type = 'button'; cp.className = 'act'; cp.textContent = '📋 نسخ';
      cp.addEventListener('click', function(){ navigator.clipboard.writeText(text); cp.textContent = '✅ تم النسخ'; setTimeout(function(){ cp.textContent = '📋 نسخ'; }, 1500); });
      ac2.appendChild(cp); d.appendChild(ac2);
    }
    chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
  }

  async function askAI(msgs){
    var sl = String.fromCharCode(47);
    var sys = {role:'system', content:'أنت DARK HORIZON AI، مساعد ذكاء اصطناعي خبير تتحدث بالعربية والدارجة والفرنسية والإنجليزية بطلاقة وأسلوب إنساني ذكي.'};
    var payload = [sys].concat(msgs.slice(-6));
    var errs = [];

    // 1. بوابة Pollinations المفتوحة (GET المباشر السريع والمضمون في المتصفح)
    try {
      var lastMsg = msgs.slice(-1).shift().content;
      var qUrl = 'https:' + sl + sl + 'text.pollinations.ai' + sl + encodeURIComponent(lastMsg) + '?system=' + encodeURIComponent(sys.content) + '&model=openai&seed=' + Math.floor(Math.random()*9999);
      var r1 = await fetch(qUrl);
      if (r1.ok) {
        var t1 = await r1.text();
        if (t1 && t1.length > 1 && t1.indexOf('<!DOCTYPE') === -1) return t1;
      } else { errs.push('P1:' + r1.status); }
    } catch(e1) { errs.push('P1:Net'); }

    // 2. بوابة Hugging Face Inference بتوكنك
    try {
      var hfUrl = 'https:' + sl + sl + 'router.huggingface.co' + sl + 'v1' + sl + 'chat' + sl + 'completions';
      var r2 = await fetch(hfUrl, {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer NONE'},
        body: JSON.stringify({model: 'Qwen/Qwen2.5-72B-Instruct', messages: payload, max_tokens: 800})
      });
      if (r2.ok) {
        var d2 = await r2.json();
        var c2 = d2.choices && d2.choices.shift();
        if (c2 && c2.message && c2.message.content) return c2.message.content;
      } else { errs.push('HF:' + r2.status); }
    } catch(e2) { errs.push('HF:Net'); }

    // 3. بوابة Pollinations الرسمية بتوكنك
    try {
      var pUrl = 'https:' + sl + sl + 'gen.pollinations.ai' + sl + 'v1' + sl + 'chat' + sl + 'completions';
      var r3 = await fetch(pUrl, {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer sk_gXvcVz7Zs6flGPFymOabkTHL5CvArpz3'},
        body: JSON.stringify({model: 'openai', messages: payload})
      });
      if (r3.ok) {
        var d3 = await r3.json();
        var c3 = d3.choices && d3.choices.shift();
        if (c3 && c3.message && c3.message.content) return c3.message.content;
      } else { errs.push('P2:' + r3.status); }
    } catch(e3) { errs.push('P2:Net'); }

    throw new Error(errs.join(' | '));
  }

  function renderStoryVideo(imgUrls){
    return new Promise(function(resolve){
      var loaded = [], done = 0;
      imgUrls.forEach(function(u, idx){
        var im = new Image(); im.crossOrigin = 'anonymous';
        im.onload = function(){ loaded[idx] = im; if(++done === imgUrls.length) build(); };
        im.onerror = function(){ if(++done === imgUrls.length) build(); };
        im.src = u;
      });
      function build(){
        var imgs = loaded.filter(Boolean);
        var cv = document.createElement('canvas'); cv.width = 720; cv.height = 720;
        var ctx = cv.getContext('2d');
        var rec = new MediaRecorder(cv.captureStream(30));
        var chunks = [];
        rec.ondataavailable = function(e){ if(e.data.size > 0) chunks.push(e.data); };
        rec.onstop = function(){ resolve(URL.createObjectURL(new Blob(chunks, {type: 'video/webm'}))); };
        rec.start();
        var f = 0, perScene = 60, total = imgs.length * perScene;
        var tmr = setInterval(function(){
          var scIdx = Math.min(Math.floor(f / perScene), imgs.length - 1);
          var localP = (f % perScene) / perScene;
          var cur = imgs[scIdx];
          var next = imgs[(scIdx + 1) % imgs.length];
          ctx.globalAlpha = 1;
          var sc = 1 + localP * 0.12, w = cv.width * sc, h = cv.height * sc;
          ctx.drawImage(cur, (cv.width - w)*0.5 - localP*15, (cv.height - h)*0.5, w, h);
          if(localP > 0.75 && imgs.length > 1){
            ctx.globalAlpha = (localP - 0.75) * 4;
            ctx.drawImage(next, 0, 0, cv.width, cv.height);
          }
          if(++f >= total){ clearInterval(tmr); rec.stop(); }
        }, 33);
      }
    });
  }

  async function doSend(){
    var t = q.value.trim(); if(!t && !attData) return; q.value = '';
    var cData = attData, cType = attType, cName = attName; attData = null; attType = null; attName = ''; prevBar.style.display = 'none';
    addMsg('USER', t || ('📎 ملف: ' + cName), cType === 'img' ? {user_img: cData} : null);
    var wait = addMsg('AI', '⏳ جاري المعالجة...'); var low = t.toLowerCase();
    var sl = String.fromCharCode(47);
    var tok = 'Bearer sk_gXvcVz7Zs6flGPFymOabkTHL5CvArpz3';

    try{
      if(low.indexOf('فيديو') !== -1 || low.indexOf('مقطع') !== -1 || low.indexOf('تحريك') !== -1 || low.indexOf('video') !== -1){
        var cleanV = t.replace(/صمم لي فيديو|صمم فيديو|اصنع فيديو|انشئ فيديو|فيديو|مقطع/g, '').trim();
        var promptReq = 'Translate this Arabic video scene description into a clear, realistic, modest English video prompt (12 to 18 words, ONLY English words, no intro): ' + (cleanV || 'two friends talking warmly about friendship');
        var enRaw = await askAI([{role:'user', content: promptReq}]);
        var enBase = enRaw.split('\n').pop().replace(/[^a-zA-Z0-9 ,.-]/g, '').trim().slice(0, 150);
        if(enBase.length < 6) enBase = 'two friends sitting together talking warmly and smiling, realistic cinematic video';

        // توليد نص الحوار العربي القصير للمشهد
        var scriptText = '';
        if(low.indexOf('حوار') !== -1 || low.indexOf('صداق') !== -1 || low.indexOf('قص') !== -1 || cleanV.length > 4){
          scriptText = await askAI([{role:'user', content:'اكتب حواراً قصيراً جداً ومؤثراً من سطرين فقط باللغة العربية يناسب هذا المشهد: ' + cleanV}]);
        }

        // 1. المسار الصحيح لتوليد الفيديو الحقيقي بحركة الأجسام والنظرات (/video/)
        var gotReal = false;
        if(cType !== 'img'){
          var vMods = ['wan', 'seedance', 'ltx-video'];
          for(var i=0; i<vMods.length; i++){
            wait.innerHTML = '🎬 جاري توليد حركة واقعية للأجسام والنظرات (' + vMods[i] + ')... قد يستغرق 20 ثانية';
            try{
              var vu = 'https:' + sl + sl + 'gen.pollinations.ai' + sl + 'video' + sl + encodeURIComponent(enBase) + '?model=' + vMods[i] + '&width=720&height=720&nologo=true&seed=' + Math.floor(Math.random()*99999);
              var vr = await fetch(vu, {headers: {'Authorization': tok}});
              if(vr.ok){
                var vBlob = await vr.blob();
                if(vBlob.size > 15000){
                  var vUrl = URL.createObjectURL(vBlob);
                  wait.remove();
                  var msgHtml = '🎬 <b>تم إنتاج الفيديو السينمائي بحركة واقعية:</b>' + (scriptText ? '<br><br>🎙️ <b>الحوار:</b><br>' + scriptText : '');
                  addMsg('AI', msgHtml, {vid: vUrl});
                  if(scriptText && 'speechSynthesis' in window){
                    var ut = new SpeechSynthesisUtterance(scriptText.replace(/[*#]/g,''));
                    ut.lang = 'ar-SA'; window.speechSynthesis.speak(ut);
                  }
                  gotReal = true; break;
                }
              }
            }catch(e){}
          }
        }

        // 2. مسار اللقطات السينمائية المتسلسلة (بدون تكبير/تصغير مزعج - انتقالات سينمائية نظيفة)
        if(!gotReal){
          var steps = [
            enBase + ', wide shot, natural expressions',
            enBase + ', medium shot, looking at each other talking',
            enBase + ', over the shoulder cinematic angle, warm lighting',
            enBase + ', close-up emotional expression, cinematic depth'
          ];
          var imgs = cType === 'img' ? [cData] : [];
          if(cType !== 'img'){
            for(var k=0; k<steps.length; k++){
              wait.innerHTML = '🎬 جاري إخراج اللقطة السينمائية (' + (k+1) + '/4)...';
              var fu = 'https:' + sl + sl + 'gen.pollinations.ai' + sl + 'image' + sl + encodeURIComponent(steps[k]) + '?width=720&height=720&model=flux&nologo=true&seed=' + (3000 + k*411 + Math.floor(Math.random()*900));
              var fr = await fetch(fu, {headers: {'Authorization': tok}});
              if(fr.ok) imgs.push(URL.createObjectURL(await fr.blob()));
            }
          }
          if(imgs.length === 0) throw new Error('تعذر توليد المشاهد');
          var loaded = await Promise.all(imgs.map(function(u){
            return new Promise(function(res){
              var im = new Image(); im.crossOrigin = 'anonymous';
              im.onload = function(){ res(im); }; im.onerror = function(){ res(null); }; im.src = u;
            });
          }));
          loaded = loaded.filter(Boolean);
          var cv = document.createElement('canvas'); cv.width = 720; cv.height = 720;
          var ctx = cv.getContext('2d');
          var rec = new MediaRecorder(cv.captureStream(30));
          var chunks = [];
          rec.ondataavailable = function(e){ if(e.data.size > 0) chunks.push(e.data); };
          var doneRec = new Promise(function(res){ rec.onstop = function(){ res(URL.createObjectURL(new Blob(chunks, {type:'video/webm'}))); }; });
          rec.start();
          var f = 0, per = 50, tot = loaded.length * per;
          await new Promise(function(res){
            var tm = setInterval(function(){
              var idx = Math.min(Math.floor(f / per), loaded.length - 1);
              var lp = (f % per) / per;
              var im1 = loaded[idx], im2 = loaded[(idx + 1) % loaded.length];
              ctx.globalAlpha = 1;
              ctx.drawImage(im1, 0, 0, 720, 720);
              if(lp > 0.75 && loaded.length > 1){
                ctx.globalAlpha = (lp - 0.75) / 0.25;
                ctx.drawImage(im2, 0, 0, 720, 720);
              }
              if(++f >= tot){ clearInterval(tm); rec.stop(); res(); }
            }, 33);
          });
          var finalVid = await doneRec;
          wait.remove();
          var fallbackHtml = '🎬 <b>تم إنتاج المشاهد السينمائية المتسلسلة:</b>' + (scriptText ? '<br><br>🎙️ <b>الحوار الصوتي:</b><br>' + scriptText : '');
          addMsg('AI', fallbackHtml, {vid: finalVid});
          if(scriptText && 'speechSynthesis' in window){
            var ut2 = new SpeechSynthesisUtterance(scriptText.replace(/[*#]/g,''));
            ut2.lang = 'ar-SA'; window.speechSynthesis.speak(ut2);
          }
        }
      } else if((low.indexOf('صورة') !== -1 || low.indexOf('صور') !== -1 || low.indexOf('ارسم') !== -1 || low.indexOf('صمم') !== -1 || low.indexOf('image') !== -1) && cType !== 'img'){
        var cleanT = t.replace(/صمم لي صور|صمم لي صورة|صمم صورة|ارسم لي|ارسم|صور|صورة/g, '').trim();
        var en = cleanT.length > 2 ? await askAI([{role:'user', content:'Write a short, realistic, modest 8K English photo description (max 15 words, ONLY English): ' + cleanT}]) : 'majestic Arabian horse in golden Sahara desert at sunset, ultra realistic 8k photography';
        en = en.replace(/[^a-zA-Z0-9 ,.-]/g, '').trim().slice(0, 140) || 'cinematic ultra realistic 8k landscape photography';
        var apiImg = 'https:' + sl + sl + 'gen.pollinations.ai' + sl + 'image' + sl + encodeURIComponent(en) + '?width=1024&height=1024&model=flux&nologo=true&seed=' + Math.floor(Math.random()*999999);
        var ir = await fetch(apiImg, {headers: {'Authorization': tok}});
        if(!ir.ok) throw new Error('Image HTTP ' + ir.status);
        var imgUrl = URL.createObjectURL(await ir.blob());
        wait.remove(); addMsg('AI', '🎨 <b>تم تصميم الصورة بدقة عالية:</b>', {img: imgUrl});
      } else {
        var fullT = cType === 'doc' ? (t + '\n\n[محتوى الملف ' + cName + ']:\n' + String(cData).slice(0, 4000)) : (t || 'مرحباً');
        hist.push({role:'user', content: fullT});
        var rep = await askAI(hist);
        hist.push({role:'assistant', content: rep});
        wait.remove(); addMsg('AI', rep);
      }
    } catch(err){
      wait.innerHTML = '⚠️ خطأ اتصال: ' + (err.message || err);
    }
  }

  document.getElementById('btnSend').addEventListener('click', doSend);
  q.addEventListener('keydown', function(e){ if(e.key === 'Enter') doSend(); });
})();
</script></body></html>
