<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DARK HORIZON AI - FLUX.1-dev</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
  body{background:#060913;color:#f8fafc;height:100dvh;display:flex;flex-direction:column}
  header{padding:14px 18px;background:#0f172a;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center}
  .title{font-weight:800;font-size:16px;color:#38bdf8}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:85%;padding:12px 16px;border-radius:16px;font-size:15px;line-height:1.6}
  .user{align-self:flex-start;background:#2563eb;color:#fff}
  .bot{align-self:flex-end;background:#1e293b;border:1px solid #334155}
  .bot img{width:100%;max-width:360px;border-radius:12px;margin-top:10px;display:block}
  .dl-btn{display:inline-block;margin-top:10px;padding:8px 14px;background:#38bdf8;color:#060913;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px}
  .bar{padding:12px;background:#0f172a;border-top:1px solid #1e293b;display:flex;gap:8px}
  input{flex:1;background:#1e293b;border:1px solid #334155;color:#fff;padding:12px 14px;border-radius:12px;font-size:15px;outline:none}
  button{background:#38bdf8;color:#060913;border:none;padding:0 18px;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer}
</style>
</head>
<body>

<header>
  <div class="title">DARK HORIZON ✦ FLUX.1-dev</div>
</header>

<div id="chat"></div>

<div class="bar">
  <input id="prompt" type="text" placeholder="اكتب وصف الصورة بدقة (مثال: فتاة تقرأ كتاباً بجانب نافذة مشمسة)...">
  <button id="send">تصميم</button>
</div>

<script>
const API_URL = "https://onrender.com";
const chat = document.getElementById("chat");
const input = document.getElementById("prompt");
const btn = document.getElementById("send");

function addBubble(html, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function createImage() {
  const text = input.value.trim();
  if (!text) return;

  addBubble(text, "user");
  input.value = "";
  const loading = addBubble("⏳ جاري توليد الصورة عبر FLUX.1-dev (1024×1024)...", "bot");

  // تحسين الوصف للحصول على نفس الواقعية الفوتوغرافية
  const enhancedPrompt = text + ", photorealistic, 8k DSLR photography, natural soft lighting, sharp focus, masterpiece";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: enhancedPrompt })
    });

    if (!res.ok) throw new Error("فشل الاتصال بالخادم");

    const blob = await res.blob();
    const imgUrl = URL.createObjectURL(blob);

    loading.innerHTML = `
      <div>✨ تم التصميم بواسطة <b>FLUX.1-dev</b>:</div>
      <img src="${imgUrl}" alt="Generated Image">
      <a class="dl-btn" href="${imgUrl}" download="DarkHorizon_FLUX_1024.jpg">⬇️ تحميل الصورة</a>
    `;
  } catch (err) {
    loading.innerHTML = "⚠️ الخادم قيد الاستيقاظ أو مشغول، انتظر 20 ثانية واضغط تصميم مرة أخرى.";
  }
}

btn.onclick = createImage;
input.onkeydown = (e) => { if (e.key === "Enter") createImage(); };
</script>
</body>
</html>
